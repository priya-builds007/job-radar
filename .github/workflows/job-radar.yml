name: Job Radar Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check configuration
        run: |
          python -m radar doctor --skip-dependencies

      - name: Crawl jobs
        run: |
          python -m radar.crawl --sleep-seconds 8

      - name: Process jobs
        run: |
          python -m radar.process

      - name: Commit updated job data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/processed_jobs.json
          git diff --cached --quiet || git commit -m "chore: refresh job data"
          git push
