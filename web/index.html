<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Job Radar - AI Career Command Center for fresher and entry-level engineering jobs">
  <meta name="theme-color" content="#050807">
  <title>Job Radar - AI Career Command Center</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%23050807%27 stroke=%27%2339ff8c%27 stroke-width=%272%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%273%27 fill=%27%2339ff8c%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="bgParticles" aria-hidden="true"></canvas>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#/dashboard" aria-label="Job Radar home">
      <span class="brand-mark" aria-hidden="true"><i></i></span>
      <span class="brand-text"><b>JOB RADAR</b><small>AI CAREER COMMAND CENTER</small></span>
    </a>
    <nav class="nav-desktop" id="navDesktop" aria-label="Main"></nav>
    <div class="status-pill" id="aiPill"><span class="dot"></span><span id="aiPillText">AI ONLINE</span></div>
  </header>

  <main id="main">
    <section class="page" id="page-dashboard" data-title="Dashboard"></section>
    <section class="page" id="page-jobs" data-title="Jobs"></section>
    <section class="page" id="page-agent" data-title="AI Agent"></section>
    <section class="page" id="page-resume" data-title="Resume"></section>
    <section class="page" id="page-skills" data-title="Skill Gap"></section>
    <section class="page" id="page-roadmap" data-title="Roadmap"></section>
    <section class="page" id="page-applications" data-title="Applications"></section>
    <section class="page" id="page-insights" data-title="Insights"></section>
  </main>

  <nav class="nav-mobile" id="navMobile" aria-label="Main mobile"></nav>
  <div class="more-sheet" id="moreSheet" hidden></div>

  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card glass" id="modalCard"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="success-burst" id="burst" aria-hidden="true"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="23"/><path d="M15 27l8 8 14-16"/></svg></div>

  <script src="js/core.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/store.js"></script>
  <script src="js/match.js"></script>
  <script src="js/resume.js"></script>
  <script src="js/search.js"></script>
  <script src="js/knowledge.js"></script>
  <script src="js/agent.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
